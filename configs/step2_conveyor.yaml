# Step2（発展）: 流れ続けるベルトの上の部品を、止めずにつかむ。step2.yaml との違いは task.conveyor と保存先

sim:
  dt: 0.01          # シミュレーションの刻み [s]
  control_hz: 20    # 方策の制御・記録の周期 [Hz]（1周期 = シミュ5ステップ）
  seed: 0

part:
  size: 0.05

camera:
  inspect:
    res: [512, 512]
    fov: 30
    height: 0.2
  overview:
    res: [1280, 720]
    fov: 45
  policy:           # ACTの入力画像
    res: [256, 256]
    front_pos: [1.25, 0.0, 0.75]
    front_lookat: [0.45, 0.0, 0.0]
    front_fov: 55
    wrist_fov: 70
    wrist_near: 0.01  # 手首カメラは物に近いので、近くを描画しない範囲（既定0.1 m）を狭める

task:
  pos_noise: 0.02   # （このタスクでは使わない。部品の位置は conveyor で決める）
  yaw_noise: 15     # 部品の向きのばらつき [deg]（±）
  home_noise: 0.03  # 開始時の手先位置のばらつき [m]（±）
  bin_noise: 0.02   # 箱の中で置く位置のばらつき [m]（±）
  conveyor:
    start_x: 0.80          # 部品が流れ始める位置 [m]（検査位置より上流）
    y_noise: 0.01          # ベルトの幅方向のばらつき [m]（±）
    speed: [0.02, 0.06]    # ベルトの速度の範囲 [m/s]（エピソードごとに一様に選ぶ）
    nominal_speed: 0.04    # 比較用スクリプトが前提にする速度 [m/s]
    lead: 0.1              # 追従の遅れを補うため、何秒先の位置に手先を合わせるか [s]

data:
  raw_dir: data/step2_conveyor/raw            # エピソードごとのnpz
  lerobot_root: data/step2_conveyor/lerobot   # LeRobot形式
  repo_id: local/inspection_sort_conveyor
